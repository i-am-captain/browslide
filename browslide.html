<!doctype html>
<!--
  ===================== BROWSLIDE — AGENT MAP =====================
  Read this map, NOT the whole file (~1150 lines). Every area has a unique
  ANCHOR string. Locate it with:
      grep -nF 'ANCHOR' browslide.html
  You will get two hits: this map line, then the target. Use the later one.
  Then read only that range. Anchors never go stale, so this map uses no
  line numbers — do not add any back.
  WHAT THIS FILE IS: standalone presentation app in one HTML file (plain
  CSS + plain JS, zero dependencies, works from file://). The repo copy is
  the TEMPLATE (starter deck only). In-app Save downloads a copy whose JSON
  data block holds the real deck; saved copies reopen by double-click.
  RULES FOR AGENTS (binding):
  1. Never load the whole file into a small context. Map + grep + slices.
  2. If you rename or remove a banner anchor, update the map below.
  3. Slide HTML is sanitized on sync/save/open: script/iframe/object/embed
     elements, on* attributes, javascript:/blob: URLs and srcset are
     stripped. Do not try to smuggle executable content into slides.
  4. Media lives ONCE in model.resources as data: URIs; slide HTML stores
     res://rN refs (deduped by content hash). The live stage shows expanded
     data: URIs for editing only; saves/exports store single copies.
  5. Deck state on disk = the JSON data block only. Never hand-edit app
     code in a saved copy; change the data block (or use the app UI).
  AREAS — one anchor per line (copy-paste into grep -nF; take the later hit):
  - doctype: line 1
  - html/head: <title>Browslide</title>
  - CSS styles: /* ================= CSS ================= */
  - toolbar: <header id="toolbar">
  - editor columns: <div id="main">
  - present overlay: id="present-overlay"
  - hidden file inputs: id="open-file"
  - deck JSON data block: id="slider-data"
  - utilities: /* ================= UTIL ================= */
  - data model: /* ================= MODEL ================= */
  - compression/codec: /* ---- optional lossless compression: native deflate, zero dependencies ----
  - resources table: /* ---- resources table: slides store res://id refs, binaries live once in model.resources ---- */
  - autosave store: /* ================= STORE (IndexedDB autosave) ================= */
  - rendering: /* ================= RENDER ================= */
  - editing: /* ================= EDIT ================= */
  - presenter: /* ================= PRESENT ================= */
  - viewer export: /* ================= EXPORT VIEWER =================
  - save/open/new: /* ================= SAVE / OPEN / NEW ================= */
  - sizes panel: /* ================= SIZE METER ================= */
  - events/boot: /* ================= EVENTS + BOOT ================= */
  - boot(): function boot(){
  SLIDE OBJECT: {title,layout,transition,html,notes}; layouts: title,
  title-body, two-col, image-full, blank. Slide html uses res://rN refs
  for media; new media must go into model.resources (see RESOURCES TABLE).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browslide</title>
<style>
/* ================= CSS ================= */
:root{
  --bg:#f1f2f5; --panel:#ffffff; --ink:#1c1e21; --muted:#6b7280;
  --accent:#2563eb; --border:#d9dce1;
  --slide-bg:#ffffff; --slide-ink:#1c1e21;
}
body[data-theme="dark"]{
  --bg:#14161a; --panel:#1e2126; --ink:#e8eaed; --muted:#9aa0a6;
  --border:#34383f; --slide-bg:#22252b; --slide-ink:#f0f1f3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
[hidden]{display:none !important}
#toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;flex:0 0 auto}
.brand{font-weight:700;margin-right:4px}
#deck-title{min-width:160px;max-width:280px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink)}
#dirty-flag{color:var(--muted);font-size:12px;min-width:120px}
#dirty-flag.dirty{color:#b45309}
.spacer{flex:1}
button,select{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit}
button:hover,select:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#pos-flag{color:var(--muted);font-size:12px}
#formatbar{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;flex:0 0 auto}
#formatbar select{padding:4px 6px}
#formatbar button{min-width:30px}
#formatbar button.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#formatbar .sep{width:1px;height:20px;background:var(--border)}
#formatbar .ali{display:inline-block;width:16px;vertical-align:middle}
#formatbar .ali i{display:block;height:2px;background:currentColor;margin:2.5px 0}
#formatbar .ali.c i{margin-left:4px;margin-right:4px}
#formatbar .ali.r i{margin-left:8px}
#formatbar .ali.j i:nth-child(2){margin-right:4px}
#main{display:grid;grid-template-columns:190px 1fr 230px;gap:10px;padding:10px;flex:1 1 auto;min-height:0}
#filmstrip{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:auto;padding:8px}
#filmstrip-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#filmstrip-list li{display:flex;gap:4px}
#filmstrip-list button.nav{flex:1;min-width:0;display:block;text-align:left;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit}
#filmstrip-list button.nav:hover{border-color:var(--accent)}
#filmstrip-list button.del{flex:0 0 auto;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit}
#filmstrip-list button.del:hover{border-color:#b91c1c;color:#b91c1c}
#filmstrip-list li.active button.nav{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#btn-add-end{width:100%;margin-top:6px}
#filmstrip-list .num{color:var(--muted);font-size:11px;margin-right:6px}
#filmstrip-list li[draggable="true"]{cursor:grab}
#filmstrip-list li.drop-before{box-shadow:0 -3px 0 var(--accent)}
#stage-wrap{overflow:auto;padding:18px;background:var(--panel);border:1px solid var(--border);border-radius:8px;position:relative}
#stage{width:100%;height:100%}
#inspector{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:10px}
#inspector label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
#inspector select,#inspector textarea{width:100%}
#inspector textarea{resize:vertical;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px}
#size-meter{font-size:12px;color:var(--muted)}
#size-meter.warn{color:#b45309}
#size-meter.big{color:#b91c1c}
#sizes-body{font-size:12px}
#sizes-body div{margin:2px 0}
#sizes-body .unused{color:var(--muted)}
#inspector label.row select{width:auto;padding:2px 4px}
#compress-stats{color:var(--muted);font-size:12px}
#sizes-body button{padding:2px 8px;font-size:11px}
#aspect-custom{display:flex;gap:8px}
#aspect-custom label{flex-direction:row;align-items:center}
#aspect-custom input{width:64px}
#repo-link{margin-top:auto;padding-top:10px;text-align:center;font-size:12px}
#repo-link a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:none;background:none;padding:2px 6px}
#repo-link a:hover{color:var(--accent)}
#media-resizer{position:absolute;border:2px solid var(--accent);border-radius:4px;pointer-events:none;z-index:5}
#media-resizer .mhandle{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;background:var(--accent);border:2px solid #fff;border-radius:50%;cursor:nwse-resize;pointer-events:auto;touch-action:none}
#media-resizer .mbadge{position:absolute;top:-26px;right:-2px;background:var(--accent);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;white-space:nowrap}
#media-resizer .mmove{position:absolute;left:-10px;top:-10px;width:20px;height:20px;line-height:16px;text-align:center;background:var(--accent);color:#fff;border:2px solid #fff;border-radius:50%;cursor:move;pointer-events:auto;touch-action:none;display:none;font-size:11px}
#media-resizer.formove .mmove{display:block}
.slide .blk{position:absolute;box-sizing:border-box;min-width:8%;min-height:1.2em}
#inspector label.row{display:flex;flex-direction:row;align-items:center}
#present-settings{display:flex;flex-direction:column;gap:6px}
#present-settings summary{cursor:pointer;color:var(--muted);font-size:12px}
/* ---- slides ---- */
.slide{width:100%;margin:auto;aspect-ratio:16/9;overflow:auto;position:relative;background:var(--slide-bg);color:var(--slide-ink);
  border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.12);
  padding:44px 52px;font-size:16px;outline:none}
.slide:focus{border-color:var(--accent)}
.slide h1{font-size:2em;margin:0 0 .4em}
.slide h2{font-size:1.4em;margin:.8em 0 .3em}
.slide p,.slide li{font-size:1.05em}
.slide img,.slide video{max-width:100%;height:auto;border-radius:6px}
.slide svg{width:100%;height:auto;display:block}
.slide video{max-height:50vh}
.layout-title{display:flex;flex-direction:column;justify-content:center;text-align:center}
.layout-title-body h1{border-bottom:2px solid var(--accent);padding-bottom:.2em}
.layout-image-full{text-align:center}
.layout-blank{padding:36px}
/* ---- presenter ---- */
#present-overlay{position:fixed;inset:0;z-index:50;background:#0b0c0e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#present-slide .slide{width:min(1100px,94vw);font-size:clamp(14px,2.1vw,25px)}
#present-bar{display:flex;gap:16px;align-items:center;color:#c8ccd2;font-size:13px}
#present-bar button{background:#22262c;color:#fff;border-color:#3a3f47}
.trans-fade{animation:fadeIn .35s ease}
.trans-slide{animation:slideIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
/* per-element step animations (present mode + viewer export) */
@keyframes animFadeIn{from{opacity:0}to{opacity:1}}
@keyframes animFadeOut{to{opacity:0}}
@keyframes animMoveL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes animMoveR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes animMoveU{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}
@keyframes animMoveD{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes animRotate{from{opacity:0;transform:rotate(-30deg) scale(.8)}to{opacity:1;transform:none}}
.anim-fade-in{animation:animFadeIn .5s ease both}
.anim-fade-out{animation:animFadeOut .5s ease both}
.anim-move-left{animation:animMoveL .5s ease both}
.anim-move-right{animation:animMoveR .5s ease both}
.anim-move-up{animation:animMoveU .5s ease both}
.anim-move-down{animation:animMoveD .5s ease both}
.anim-rotate{animation:animRotate .6s ease both}
@media (max-width:900px){#main{grid-template-columns:1fr}#filmstrip,#inspector{display:none}}
</style>
</head>

/* ================= STORE (IndexedDB autosave) ================= */
var IDB = {
  db: null,
  open: function(){
    var self = this;
    return new Promise(function(res){
      if (self.db) return res(self.db);
      try {
        var rq = indexedDB.open('browslide-db', 1);
        rq.onupgradeneeded = function(){ rq.result.createObjectStore('kv'); };
        rq.onsuccess = function(){ self.db = rq.result; res(self.db); };
        rq.onerror = function(){ res(null); };
      } catch (e) { res(null); }
    });
  },
  get: function(k){
    return this.open().then(function(db){
      return new Promise(function(res){
        if (!db) return res(null);
        try {
          var rq = db.transaction('kv').objectStore('kv').get(k);
          rq.onsuccess = function(){ res(rq.result || null); };
          rq.onerror = function(){ res(null); };
        } catch (e) { res(null); }
      });
    });
  },
  set: function(k, v){
    return this.open().then(function(db){
      return new Promise(function(res){
        if (!db) return res(false);
        try {
          var rq = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
          rq.onsuccess = function(){ res(true); };
          rq.onerror = function(){ res(false); };
        } catch (e) { res(false); }
      });
    });
  }
};
var autosaveNow = function(){ IDB.set('autosave', { at: Date.now(), json: stable(App.model) }); };

    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#slider-data').textContent = built.json;
    clone.querySelector('#present-overlay').setAttribute('hidden', '');
    var rz = clone.querySelector('#media-resizer');
    if (rz) rz.setAttribute('hidden', '');
    // The live stage/presenter hold EXPANDED data: URIs for editing. The file must
    // not serialize them (each file already lives once in the data block); boot
    // rebuilds both from the model, so empty them in the clone.
    ['#stage', '#present-slide'].forEach(function(sel){
      var n = clone.querySelector(sel);
      if (n) n.innerHTML = '';
    });
    $all('[src],[href]', clone).forEach(function(el){
      ['src', 'href'].forEach(function(at){
        var v = el.getAttribute && el.getAttribute(at);
        if (v && /^\s*blob:/i.test(v)) el.removeAttribute(at);
      });
    });
    var html = '<!doctype html>\n' + clone.outerHTML;
    downloadBlob(new Blob([html], { type: 'text/html;charset=utf-8' }), slugify(App.model.title) + '.html');
    App.lastClean = stable(App.model);
    refreshDirty(); updateSize(); autosaveNow();
    var el = $('#compress-stats');
    if (el) el.textContent = built.text;
  }).catch(function(e){ alert('Save failed: ' + (e && e.message ? e.message : e)); });
}
function loadModel(m, cleanJson){
  App.model = m;
  sanitizeAllSlides(); /* ultimate backstop: no unsanitized HTML ever renders */
  App.activeId = m.slideOrder[0];
  App.lastClean = (typeof cleanJson === 'string') ? cleanJson : stable(m);
  renderAll(); autosaveNow();
}
function resumeModel(json, cleanJson){
  /* autosave resume goes through the same validation as every other load path */
  var rm = null;
  try { rm = normalizeModel(JSON.parse(json)); } catch (e) {}
  if (!rm) return false;
  decodeModelResources(rm).then(function(decoded){ loadModel(decoded, cleanJson); });
  return true;
}
function openFile(file){
  var r = new FileReader();
  r.onload = function(){
    try {
      var doc = new DOMParser().parseFromString(String(r.result || ''), 'text/html');
      var el = doc.querySelector('#slider-data');
      if (!el) throw new Error('no data block');
      var m = normalizeModel(JSON.parse(el.textContent));
      if (!m) throw new Error('bad model');
      if (App.dirty && !confirm('Discard unsaved changes and open "' + file.name + '"?')) return;
      decodeModelResources(m).then(function(decoded){ loadModel(decoded); });
    } catch (e) { alert('Could not open "' + file.name + '" as a Browslide deck.'); }
  };
  r.onerror = function(){ alert('Could not read "' + file.name + '".'); };
  r.readAsText(file);
}
function newDeck(){
  if (App.dirty && !confirm('Discard unsaved changes and start a new deck?')) return;
  var m = readEmbeddedModel();
  if (!m) { alert('Template starter data is damaged.'); return; }
  loadModel(m);
}

/* ================= SIZE METER ================= */
function updateSize(){
  var total = App.overhead + stable(App.model).length;
  var el = $('#size-meter');
  el.textContent = 'Est. save size: ' + formatBytes(total);
  el.classList.toggle('warn', total > 5 * 1024 * 1024 && total <= 20 * 1024 * 1024);
  el.classList.toggle('big', total > 20 * 1024 * 1024);
  renderSizes();
}
function renderSizes(){
  /* per-slide + per-resource size breakdown (DOM-built: names are untrusted user input) */
  var host = $('#sizes-body');
  if (!host) return;
  host.innerHTML = '';
  var res = App.model.resources || {};
  var use = deckResourceUse();
  function line(parent, text, cls){
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = text;
    parent.appendChild(d);
  }
  var rids = Object.keys(res);
  if (!rids.length) line(host, 'No media files in this deck.');
  rids.forEach(function(id){
    var r = res[id];
    var users = use[id] || 0;
    var row = document.createElement('div');
    var t = document.createElement('span');
    t.textContent = r.name + ' — ' + r.mime + ' — ' + formatBytes(r.size || 0) +
      (users ? ' — used in ' + users + ' slide(s)' : ' — UNUSED') +
      (r.size > 8 * 1024 * 1024 ? ' ⚠ large' : '') +
      (!COMPRESSIBLE_RE.test(r.mime || '') ? ' — already compressed format' : (r.noCompress ? ' — compression off' : ''));
    row.appendChild(t);
    if (COMPRESSIBLE_RE.test(r.mime || '')) {
      var b = document.createElement('button');
      b.textContent = r.noCompress ? 'store: raw' : 'store: auto';
      b.title = 'Per-file compression override (auto = compress on save when smaller)';
      b.addEventListener('click', function(){
        var rr = App.model.resources[id];
        if (!rr) return;
        rr.noCompress = !rr.noCompress;
        renderSizes(); refreshDirty(); scheduleAutosave();
      });
      row.appendChild(document.createTextNode(' '));
      row.appendChild(b);
    }
    if (!users) row.className = 'unused';
    host.appendChild(row);
  });
  line(host, '—');
  App.model.slideOrder.forEach(function(id, i){
    var s = App.model.slides[id];
    var rbytes = referencedIdsIn(s.html).reduce(function(a, rid){ return a + ((res[rid] && res[rid].size) || 0); }, 0);
    line(host, (i + 1) + '. ' + s.title + ' — text ' + formatBytes(s.html.length) +
      (rbytes ? ' + media ' + formatBytes(rbytes) + ' (shared files counted per slide)' : ''));
  });
  var btn = $('#btn-clean-media');
  var dead = rids.filter(function(id){ return !use[id]; }).length;
  btn.textContent = dead ? 'Remove unused media (' + dead + ')' : 'Remove unused media';
  btn.disabled = !dead;
}
var scheduleSize = debounce(updateSize, 1200);

/* ================= EVENTS + BOOT ================= */
function bind(){
  $('#btn-add').addEventListener('click', function(){ addSlide(); });
  $('#btn-add-end').addEventListener('click', function(){ addSlide(App.model.slideOrder.length); });
  $('#btn-duplicate').addEventListener('click', duplicateSlide);
  $('#btn-delete').addEventListener('click', deleteSlide);
  $('#btn-prev').addEventListener('click', function(){ step(-1); });
  $('#btn-next').addEventListener('click', function(){ step(1); });
  $('#btn-present').addEventListener('click', openPresent);
  $('#btn-present-close').addEventListener('click', function(e){ e.stopPropagation(); closePresent(); });
  $('#present-overlay').addEventListener('click', function(){ advancePresent(); });
  $('#btn-save').addEventListener('click', saveNow);
  $('#btn-export').addEventListener('click', exportViewer);
  $('#btn-new').addEventListener('click', newDeck);
  $('#btn-open').addEventListener('click', function(){ $('#open-file').click(); });
  $('#open-file').addEventListener('change', function(e){ if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ''; });
  $('#btn-img').addEventListener('click', function(){ $('#insert-image').click(); });
  $('#btn-video').addEventListener('click', function(){ $('#insert-video').click(); });
  $('#btn-clean-media').addEventListener('click', removeUnusedMedia);
  $('#btn-shape').addEventListener('click', function(){ insertShape($('#shape-select').value); });
  $('#btn-block').addEventListener('click', addTextBlock);
  $('#anim-effect').addEventListener('change', function(e){
    var el = selectedAnimTarget();
    if (!el) return;
    var v = e.target.value;
    if (!v || ANIM_FX.indexOf(v) < 0) {
      el.removeAttribute('data-anim');
      el.removeAttribute('data-dir');
      el.removeAttribute('data-step');
    } else {
      el.setAttribute('data-anim', v);
      if (!el.hasAttribute('data-step')) el.setAttribute('data-step', String(maxStepOnSlide() + 1));
    }
    writeAnimAttrs();
  });
  $('#anim-dir').addEventListener('change', function(e){
    var el = selectedAnimTarget();
    if (!el) return;
    el.setAttribute('data-dir', e.target.value);
    writeAnimAttrs();
  });
  $('#anim-step').addEventListener('change', function(e){
    var el = selectedAnimTarget();
    if (!el) return;
    var v = parseInt(e.target.value, 10);
    if (v >= 1 && v <= 99) el.setAttribute('data-step', String(v));
    else el.removeAttribute('data-step');
    writeAnimAttrs();
  });
  var fbar = $('#formatbar');
  fbar.addEventListener('mousedown', function(e){ if (e.target.closest('button')) e.preventDefault(); });
  fbar.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.cmd === 'clear') {
      if (!restoreSelection()) return;
      try { document.execCommand('removeFormat', false, null); } catch (err) {}
      pendingFormat = null;
      afterFormat();
    } else applyCmd(b.dataset.cmd);
  });
  $('#font-select').addEventListener('change', function(e){ applySpanStyle('fontFamily', e.target.value); });
  $('#size-select').addEventListener('change', function(e){ applySpanStyle('fontSize', e.target.value); });
  $('#style-select').addEventListener('change', function(e){ applyBlock(e.target.value); });
  document.addEventListener('selectionchange', function(){ trackSelection(); scheduleFormatUI(); });
  $('#stage-wrap').addEventListener('keyup', function(){ pendingFormat = null; scheduleFormatUI(); });
  $('#stage-wrap').addEventListener('click', function(){ pendingFormat = null; scheduleFormatUI(); });
  $('#stage-wrap').addEventListener('input', scheduleFormatUI);
  $('#opt-compress').addEventListener('change', function(e){ App.model.settings.compress = !!e.target.checked; refreshDirty(); scheduleAutosave(); });
  $('#opt-downscale').addEventListener('change', function(e){ App.model.settings.downscale = !!e.target.checked; refreshDirty(); scheduleAutosave(); });
  $('#opt-maxdim').addEventListener('change', function(e){
    var v = parseInt(e.target.value, 10);
    App.model.settings.maxDim = (v === 1280 || v === 2560) ? v : 1920;
    e.target.value = String(App.model.settings.maxDim);
    refreshDirty(); scheduleAutosave();
  });
  $('#opt-showbar').addEventListener('change', function(e){ App.model.settings.showBar = !!e.target.checked; refreshDirty(); scheduleAutosave(); });
  $('#opt-tight').addEventListener('change', function(e){ App.model.settings.tight = !!e.target.checked; refreshDirty(); scheduleAutosave(); });
  $('#insert-image').addEventListener('change', function(e){ if (e.target.files[0]) insertFile(e.target.files[0], 'image'); e.target.value = ''; });
  $('#insert-video').addEventListener('change', function(e){ if (e.target.files[0]) insertFile(e.target.files[0], 'video'); e.target.value = ''; });
  $('#deck-title').addEventListener('input', debounce(function(e){
    App.model.title = e.target.value.slice(0, 120);
    document.title = (App.model.title || 'Browslide') + ' — Browslide';
    refreshDirty(); scheduleAutosave();
  }, 300));
  $('#layout-select').addEventListener('change', function(e){
    var s = activeSlide(); if (!s) return;
    s.layout = e.target.value;
    var sec = $('#stage .slide'); if (sec) sec.className = 'slide layout-' + s.layout;
    refreshDirty(); scheduleAutosave();
  });
  $('#transition-select').addEventListener('change', function(e){ activeSlide().transition = e.target.value; refreshDirty(); scheduleAutosave(); });
  $('#theme-select').addEventListener('change', function(e){
    App.model.theme = e.target.value;
    document.body.dataset.theme = App.model.theme;
    refreshDirty(); scheduleAutosave();
  });
  $('#notes').addEventListener('input', debounce(function(e){ activeSlide().notes = e.target.value; refreshDirty(); scheduleAutosave(); }, 300));
  $('#stage').addEventListener('mousedown', function(e){
    var t = e.target;
    var blk = t && t.closest ? t.closest('.blk') : null;
    if (blk && $('#stage').contains(blk)) {
      if (resizer.el !== blk) { e.preventDefault(); selectMedia(blk); }
      return; /* already selected: let the browser place the caret for editing */
    }
    var m = t && t.closest ? t.closest('img,video') : null;
    if (m && $('#stage').contains(m)) selectMedia(m);
    else deselectMedia();
  });
  $('#stage-wrap').addEventListener('scroll', function(){ positionResizer(); });
  $('#aspect-select').addEventListener('change', function(e){
    if (e.target.value === '16:9') setAspect(16, 9);
    else if (e.target.value === '4:3') setAspect(4, 3);
    else {
      /* custom picked: reveal W/H prefilled with current values, apply on edit.
         (Do NOT syncAspectUI() here — it would snap the select back to the
         still-unchanged model preset.) */
      var a = deckAR();
      $('#aspect-custom').removeAttribute('hidden');
      if (document.activeElement !== $('#aspect-w')) $('#aspect-w').value = a.w;
      if (document.activeElement !== $('#aspect-h')) $('#aspect-h').value = a.h;
    }
  });
  $('#aspect-w').addEventListener('change', function(e){ setAspect(e.target.value, App.model.aspect.h); });
  $('#aspect-h').addEventListener('change', function(e){ setAspect(App.model.aspect.w, e.target.value); });
  window.addEventListener('resize', debounce(function(){ fitStage(); fitPresent(); }, 100));
  $('#filmstrip-list').addEventListener('keydown', function(e){
    var ids = App.model.slideOrder, i = activeIndex(), j = -1;
    if (e.key === 'ArrowDown') j = Math.min(ids.length - 1, i + 1);
    else if (e.key === 'ArrowUp') j = Math.max(0, i - 1);
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = ids.length - 1;
    else return;
    e.preventDefault();
    gotoSlide(ids[j]);
    var btn = $('#filmstrip-list li:nth-child(' + (j + 1) + ') button');
    if (btn) btn.focus();
  });
  document.addEventListener('keydown', function(e){
    var presenting = !$('#present-overlay').hidden;
    if (presenting) {
      if (e.key === 'Escape') { e.preventDefault(); closePresent(); }
      else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter') { e.preventDefault(); advancePresent(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); showPresent(App.presentIdx - 1, true); }
      else if (e.key === 'Home') { e.preventDefault(); showPresent(0, true); }
      else if (e.key === 'End') { e.preventDefault(); showPresent(App.model.slideOrder.length - 1, true); }
      return;
    }
    if (e.key === 'Escape' && resizer.el) { deselectMedia(); e.preventDefault(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); saveNow(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); $('#open-file').click(); }
    else if ((e.key === 'PageDown' || e.key === 'PageUp' || e.key === 'Home' || e.key === 'End') && !isEditingFocus()) {
      e.preventDefault();
      if (e.key === 'PageDown') step(1);
      else if (e.key === 'PageUp') step(-1);
      else if (e.key === 'Home') gotoSlide(App.model.slideOrder[0]);
      else gotoSlide(App.model.slideOrder[App.model.slideOrder.length - 1]);
    }
  });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('drop', function(e){
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) openFile(f);
  });
}
function boot(){
  var m = readEmbeddedModel();
  if (!m) { document.body.innerHTML = '<p style="padding:2em">Browslide template data is damaged.</p>'; return; }
  try {
    var full = '<!doctype html>\n' + document.documentElement.outerHTML;
    App.overhead = full.length - $('#slider-data').textContent.length;
  } catch (e) { App.overhead = 60000; }
  decodeModelResources(m).then(function(decoded){
    App.model = decoded;
    App.activeId = decoded.slideOrder[0];
    App.lastClean = stable(decoded);
    bind();
    renderAll();
  IDB.get('autosave').then(function(rec){
    if (!rec || !rec.json || rec.json === App.lastClean) return;
    var age = rec.at ? new Date(rec.at).toLocaleString() : 'unknown time';
    if (confirm('Unsaved work from ' + age + ' was found. Resume it?')) {
      resumeModel(rec.json, App.lastClean);
    }
  });
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
